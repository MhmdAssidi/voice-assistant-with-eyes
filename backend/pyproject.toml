# Tool settings only (dependencies live in requirements.txt).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with"]
markers = [
    "slow: loads heavy AI models or calls the VLM; skipped in CI (run locally with: pytest -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI uses function calls (File(), Form(), Query()) as defaults
